<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Companion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <h1>AI Chat Companion</h1>
                <p>Powered by OpenRouter</p>
            </div>
            <div class="status-indicator">
                <span id="connection-status" class="status-dot disconnected"></span>
                <span id="connection-text">Connecting...</span>
            </div>
        </header>

        <main class="chat-box" id="chat-box">
            <!-- Messages will be injected here -->
            <div class="message ai-message welcome-message">
                <div class="message-content">
                    <p>Hello! I'm your AI assistant. How can I help you today?</p>
                </div>
                <div class="message-timestamp">Now</div>
            </div>
        </main>

        <div class="typing-indicator hidden" id="typing-indicator">
            <span></span><span></span><span></span>
        </div>

        <footer class="chat-input-area">
            <form id="chat-form">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type a message..." 
                    autocomplete="off" 
                    required 
                />
                <button type="submit" id="send-button" disabled>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
